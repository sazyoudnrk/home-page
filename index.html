<style>
:root{--ink:#333;--sub:#777;--link:#3f86d6;--red:#d9382b;--line:#ddd;--btn:#1a1a1a;--grey:#8c8c8c}
*{box-sizing:border-box}
html{scroll-padding-top:20px}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.9 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-top:env(safe-area-inset-top)}
a{color:var(--link)}
header{background:#fff}
header .in{max-width:860px;margin:auto;padding:18px 16px 10px;display:flex;align-items:center;justify-content:center;position:relative;min-height:84px}
.logo{font:900 28px/1.3 "Noto Sans JP",sans-serif;color:#000;text-decoration:none;text-align:center}
.logo b{color:var(--red);font-weight:900}
#menu{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:6px;background:#2b2b2b;cursor:pointer;padding:0}
#menu i{display:block;width:26px;height:3px;background:#fff;margin:5px auto}
nav{display:none;flex-direction:column;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav.open{display:flex}
nav a{padding:14px 20px;color:#000;text-decoration:none;font-weight:700;border-bottom:1px solid var(--line)}
nav a:last-child{border-bottom:0}
nav a.on{color:var(--red)}

main{max-width:860px;margin:auto;padding:12px 16px 60px}
h1,h2{font-weight:400;line-height:1.5;margin:32px 0 8px}
h1{font-size:26px;margin-top:8px}
h2{font-size:24px}
h3{font-size:17px;margin:20px 0 4px}
.lead{color:var(--sub);margin:0 0 20px}
.hero{position:relative;margin:0 0 24px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}

.slides img,.slides .ph{flex:none;width:100%;aspect-ratio:1.4;object-fit:cover;scroll-snap-align:start;background:#eee}

.btn{display:inline-block;padding:14px 22px;border:5px solid var(--btn);border-radius:999px;color:var(--btn);text-decoration:none;font:700 17px/1.2 "Noto Sans JP",sans-serif;text-align:center}
.btn.sub{border-color:var(--grey);color:var(--grey)}
.notice{color:var(--link);margin:24px 0}
.box{border:1px solid var(--line);padding:14px 16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid img,.grid .ph{width:100%;aspect-ratio:1;object-fit:cover;background:#f3f3f3;display:block}
.masonry{columns:2 150px;column-gap:8px}
.masonry img,.masonry .ph{width:100%;margin-bottom:8px;display:block;background:#f3f3f3}
.ph{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub);padding:6px;text-align:center;word-break:break-all;min-height:90px}
.card{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.card img,.card .ph{width:96px;height:96px;object-fit:cover}
.card h3{margin:0;font-size:16px}.card p{margin:0;font-size:14px;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tags a{font-size:13px;padding:2px 10px;border:1px solid var(--line);text-decoration:none}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 8px}
.chars>*{display:block;color:var(--ink);text-decoration:none;font-size:13px;line-height:1.5}
.prof{display:grid;grid-template-columns:minmax(0,46%) 1fr;gap:16px;align-items:start;margin:8px 0 16px}
.prof img{width:100%;max-width:300px;height:auto;display:block}
.prof .ph{width:100%;max-width:300px;aspect-ratio:3/4;background:none}
.prof dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.prof dt{color:var(--sub)}.prof dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.chlinks{display:flex;flex-wrap:wrap;gap:6px 18px;margin:28px 0 0}
.chars img,.chars .ph{width:100%;aspect-ratio:119/303;object-fit:contain;object-position:top;background:none;display:block;margin-bottom:8px}
@media (max-width:420px){.chars{gap:20px 6px}.chars>*{font-size:12px}}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.tabs a{padding:8px 18px;border:3px solid var(--btn);border-radius:999px;color:var(--btn);text-decoration:none;font-weight:700;font-size:15px;line-height:1.2}
.tabs a.on{background:var(--btn);color:#fff}
.log{margin:0;padding:0;list-style:none}
.log li{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log time{color:var(--sub);font-variant-numeric:tabular-nums}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#lb.open{display:flex}#lb img{max-width:100%;max-height:100%}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
a:focus-visible,button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
</style>
</head>

  /* {img:'cg01', t:'タイトル', d:'説明', u:'https://…'} */
];

const CONTACT = {

  groups: [
    ['ショップ・コミッション',[
      ['skeb（デジタル）','有償でデジタルイラストのリクエストを受け付けています。','https://skeb.jp/@sazyou_dnrk'],
      ['skeb（アナログ）','有償でアナログイラストのリクエストを受け付けています。','https://skeb.jp/@kazyou_dnrk'],

/* ============ 描画 ============ */
const $ = s => document.querySelector(s);
const ext = u => /^https?:/.test(u);
const A = (t,u,c='') => `<a class="${c}" href="${u}"${ext(u)?' target="_blank" rel="noopener"':''}>${t}</a>`;
// 画像: images/<dir>/<name>.(jpg|png|webp) を順に試し、無ければファイル名入りの枠を出す
const IMG = (dir,name,alt='',hide=false) => `<img src="images/${dir}/${name}.${EXTS[0]}" alt="${alt}" loading="lazy" data-d="${dir}" data-n="${name}" data-i="0"${hide?' data-hide="1"':''}>`;
const galImg = p => { const i = p.lastIndexOf('/'); return IMG(p.slice(0,i), p.slice(i+1), '', true); };
document.addEventListener('error', e => {
  const im = e.target; if (im.tagName !== 'IMG' || !im.dataset.n) return;
  const i = +im.dataset.i + 1;
  if (i < EXTS.length) { im.dataset.i = i; im.src = `images/${im.dataset.d}/${im.dataset.n}.${EXTS[i]}`; return; }
  if (im.dataset.hide) { im.remove(); return; }
  im.outerHTML = `<div class="ph">images/${im.dataset.d}/${im.dataset.n}</div>`;
}, true);
document.addEventListener('load', e => { const g = e.target.closest && e.target.closest('.gal'); if (g) g.hidden = false; }, true);
const nums = (p,n) => Array.from({length:n},(_,i)=>p+String(i+1).padStart(2,'0'));

const linkCard = ([t,d,u]) => `<div class="box"><strong>${u?A(t,u):t}</strong>${u?'':' <span style="color:var(--sub);font-size:13px">（準備中）</span>'}${d?`<br><span style="color:var(--sub);font-size:14px">${d}</span>`:''}</div>`;

const VIEWS = {

  character: () => {
    if (CHERR) return `${head('CHARACTER')}<div class="box">characters.json を読み込めませんでした。GitHub Pages などに上げて、index.html と同じ場所に characters.json があるか確認してください。</div>`;
    if (!CH) return `${head('CHARACTER')}<p class="lead">読み込み中…</p>`;
    const chars = CH.characters, groups = CH.groups;
    const one = chars.find(c=>c.id===SUB);
    const grp = one ? groups.find(g=>g.id===one.group) : groups.find(g=>g.id===SUB) || groups[0];
    const tabs = groups.map(g=>`<a href="#character/${g.id==='main'?'':g.id}" role="tab" aria-selected="${g===grp&&SUB!=='birthday'}" class="${g===grp&&SUB!=='birthday'?'on':''}">${g.tab}</a>`).join('')
      + `<a href="#character/birthday" role="tab" aria-selected="${SUB==='birthday'}" class="${SUB==='birthday'?'on':''}">誕生日</a>`;
    const link = c => hasProfile(c) ? '#character/'+c.id : c.link;
    let body;
    if (SUB === 'birthday') {
      const list = chars.filter(bd).sort((a,b)=>bd(a)-bd(b));
      body = `<h2>誕生日</h2>` + (list.length ? `<ul class="log">${list.map(c=>`<li><time>${esc(c.birthday)}</time><span>${A(esc(c.name),link(c))}</span></li>`).join('')}</ul>` : `<div class="box" style="color:var(--sub)">誕生日が登録されたキャラがここに並びます</div>`);
    } else if (one) {
      const rows = F.filter(([k])=>one[k]).map(([k,l])=>`<dt>${l}</dt><dd>${esc(one[k])}</dd>`).join('')
        + (one.extra||[]).map(([l,v])=>`<dt>${esc(l)}</dt><dd>${/^https?:/.test(v)?A(esc(v),v):esc(v)}</dd>`).join('');
      const paras = (one.detail||'').split(/\n\s*\n/).filter(Boolean).map(t=>`<p>${esc(t).replace(/\n/g,'<br>')}</p>`).join('');
      body = `<p>${A('← '+grp.tab+'に戻る','#character/'+(grp.id==='main'?'':grp.id))}</p>
        <h2>${esc(one.name)}</h2>
        <div class="prof">${one.portrait?galImg(one.portrait).replace('data-hide','data-x'):IMG('character',one.image,one.name)}<dl>${rows}</dl></div>
        ${paras?`<h3>詳細</h3>${paras}`:''}
        ${(one.gallery||[]).length?`<section class="gal" hidden><h3>ギャラリー</h3><div class="masonry zoom">${one.gallery.map(galImg).join('')}</div></section>`:''}`;
    } else if (SUB === 'design') {
      body = `<h2>デザインのみ</h2>
      <p>${A('← 創作キャラに戻る','#character')}</p>
      ${DESIGN ? `<div class="masonry zoom">${nums('design',DESIGN).map(n=>IMG('character',n)).join('')}</div>` : `<div class="box" style="color:var(--sub)">（画像未設定：DESIGN に枚数を入れて images/character/design01… を置く）</div>`}`;
    } else {
      const items = chars.filter(c=>c.group===grp.id);
      body = `<h2${grp.color?` style="color:${grp.color}"`:''}>${esc(grp.heading)}${grp.song?` <small style="font-size:15px">${A('曲',grp.song)}</small>`:''}</h2>
      <div class="chars">${items.map(c=>A(IMG('character',c.image,c.name)+esc(c.name),link(c))).join('')}</div>
      <div class="chlinks">${grp.id==='main'?A('デザインのみ','#character/design'):''}${grp.world?A('世界観説明',grp.world):''}</div>`;
    }
    return `${head('CHARACTER','創作キャラクターの紹介　一部だけ立ち絵がある')}
    <div class="tabs" role="tablist">${tabs}</div>${body}`;
  },
  gallery: () => {
    const T = [['art','絵'],['made','制作物'],['cg','3DCG'],['video','動画'],['music','音楽'],['craft','工作']];
    const cur = T.some(t=>t[0]===SUB) ? SUB : 'art';
    const body = {
      art: () => `<div class="masonry zoom">${nums('art',ART).map(n=>IMG('gallery',n)).join('')}</div>`,
      made: () => MADE.map(x=>`<div class="box card">${IMG('gallery',x.img)}<div><h3>${A(x.t,x.u)}</h3><p>${x.d}</p></div></div>`).join(''),
      cg: () => CG3D.length ? `<div class="grid zoom">${CG3D.map(x=>`<div>${IMG('gallery',x.img,x.t)}<p style="margin:4px 0 0;font-size:13px">${x.u?A(x.t,x.u):x.t}${x.d?'<br><span style="color:var(--sub)">'+x.d+'</span>':''}</p></div>`).join('')}</div>` : `<div class="box" style="color:var(--sub)">（3DCG未設定：CG3D に作品を追加）</div>`,
      video: () => [['original','オリジナル曲','生きていれば音楽を作ることもある'],['cover','カバー','自作音源のUTAU（注寝ととと）のカバー動画です']].map(([k,t,d])=>`<h3>${t}</h3><p class="lead">${d}</p>${VIDEOS[k].length?VIDEOS[k].map(([n,id])=>`<div class="box"><div style="aspect-ratio:16/9"><iframe style="width:100%;height:100%;border:0" src="https://www.youtube.com/embed/${id}" title="${n}" loading="lazy" allowfullscreen></iframe></div>${n}</div>`).join(''):`<div class="box" style="color:var(--sub)">（動画未設定：VIDEOS.${k} にYouTube IDを追加）</div>`}`).join(''),
      music: () => `<p class="lead">自作音源のUTAUカバーが多め</p>${A('SoundCloudで聴く',MUSIC_URL,'btn')}`,
      craft: () => `<p class="lead">色々やるよ</p><div class="grid zoom">${nums('craft',CRAFT).map(n=>IMG('gallery',n)).join('')}</div>`
    }[cur]();
    return `${head('GALLERY','気に入らなくなったものは定期的に削除しています。どんなものを作るか　なんとなく知ってもらえたら嬉しいな')}
    <div class="tabs" role="tablist">${T.map(([k,t])=>`<a href="#gallery/${k}" role="tab" aria-selected="${k===cur}" class="${k===cur?'on':''}">${t}</a>`).join('')}</div>
    ${body}`;
  },
  comic: () => `${head('漫画')}${COMIC.map(linkCard).join('')}`,
  about: () => `
    ${head('ABOUT')}<h2>自己紹介</h2>
    ${ABOUT.intro.map(t=>`<p>${t}</p>`).join('')}
    ${ABOUT.blocks.map(([t,d,u])=>`<h2>${t}</h2><p>${d}</p>${A('見る',u,'btn')}`).join('')}`,
  contact: () => {
    const T = [['mail',CONTACT.mail[0]], ...CONTACT.groups.map((g,i)=>['g'+i,g[0]])];
    const cur = T.some(t=>t[0]===SUB) ? SUB : 'mail';
    const body = cur==='mail'
      ? `<div class="box">${CONTACT.mail[1]}<br><strong>${CONTACT.mail[2]}</strong></div>`
      : CONTACT.groups[+cur.slice(1)][1].map(linkCard).join('');
    return `${head('CONTACT','砂上電力の全てにつながるリンク集')}
    <div class="tabs" role="tablist">${T.map(([k,t])=>`<a href="#contact/${k}" role="tab" aria-selected="${k===cur}" class="${k===cur?'on':''}">${t}</a>`).join('')}</div>
    ${body}`;
  }
};

let SUB = '', LAST = '';
function route(to) {
  const [id, sub] = (to || location.hash.slice(1) || 'home').split('/');
  SUB = sub || '';
  LAST = (to || location.hash.slice(1) || 'home');
  const key = VIEWS[id] ? id : 'home';
  $('#main').innerHTML = VIEWS[key]();
  $('#nav').innerHTML = PAGES.map(([k,t])=>`<a href="#${k}" class="${k===key?'on':''}">${t}</a>`).join('');
  $('#nav').classList.remove('open'); $('#menu').setAttribute('aria-expanded','false');
  document.title = (key==='home'?'':PAGES.find(p=>p[0]===key)[1]+' | ')+'砂上拠点電力発電所';
  if (!route.keep) scrollTo(0,0);
}
addEventListener('hashchange', () => { if (location.hash.slice(1) !== LAST) route(); });
route();
fetch('characters.json').then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => { CH = d; route.keep = true; route(LAST); route.keep = false; })
  .catch(() => { CHERR = true; route.keep = true; route(LAST); route.keep = false; });

document.addEventListener('click', e => {
  const lk = e.target.closest('a[href^="#"]');
  if (lk) { e.preventDefault(); const h = lk.getAttribute('href').slice(1) || 'home'; const same = h.split('/')[0] === (location.hash.slice(1) || 'home').split('/')[0]; try { location.hash = h; } catch (_) {} route.keep = same; route(h); route.keep = false; return; }
  const m = e.target.closest('#menu');
  if (m) { m.setAttribute('aria-expanded', $('#nav').classList.toggle('open')); return; }
  const sl = e.target.closest('[data-slide]');
  if (sl) { const el = $('#slides'), w = el.clientWidth, max = el.scrollWidth - w; let x = el.scrollLeft + (+sl.dataset.slide) * w; if (x > max + 1) x = 0; if (x < 0) x = max; el.scrollTo({left:x, behavior:'smooth'}); return; }
  const im = e.target.closest('.zoom img');
  if (im) { $('#lb img').src = im.src; $('#lb').classList.add('open'); return; }
  if (e.target.closest('#lb')) $('#lb').classList.remove('open');
});
addEventListener('keydown', e => { if (e.key === 'Escape') $('#lb').classList.remove('open'); });
</script>
</body>
</html>
