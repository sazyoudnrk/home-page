/* ============ 描画 ============ */
const $ = s => document.querySelector(s);
const ext = u => /^https?:/.test(u);
const A = (t,u,c='') => `<a class="${c}" href="${u}"${ext(u)?' target="_blank" rel="noopener"':''}>${t}</a>`;
// 画像: images/<dir>/<name>.(jpg|png|webp) を順に試し、無ければファイル名入りの枠を出す
const IMG = (dir,name,alt='',hide=false) => `<img src="images/${dir}/${name}.${EXTS[0]}?v=${IMGV}" alt="${alt}" loading="lazy" data-d="${dir}" data-n="${name}" data-i="0"${hide?' data-hide="1"':''}>`;
const galImg = p => { const i = p.lastIndexOf('/'); return IMG(p.slice(0,i), p.slice(i+1), '', true).replace(' loading="lazy"',''); };
document.addEventListener('error', e => {
  const im = e.target; if (im.tagName !== 'IMG' || !im.dataset.n) return;
  const i = +im.dataset.i + 1;
  if (i < EXTS.length) { im.dataset.i = i; im.src = `images/${im.dataset.d}/${im.dataset.n}.${EXTS[i]}?v=${IMGV}`; return; }
  if (im.dataset.hide) { im.remove(); return; }
  im.outerHTML = `<div class="ph">images/${im.dataset.d}/${im.dataset.n}</div>`;
}, true);
document.addEventListener('load', e => { const g = e.target.closest && e.target.closest('.gal'); if (g) g.hidden = false; }, true);
const nums = (p,n) => Array.from({length:n},(_,i)=>p+String(i+1).padStart(2,'0'));
const head = (t,l) => `<h1>${t}</h1><p class="lead">${l||''}</p>`;
const linkCard = ([t,d,u]) => `<div class="box"><strong>${u?A(t,u):t}</strong>${u?'':' <span style="color:var(--sub);font-size:13px">（準備中）</span>'}${d?`<br><span style="color:var(--sub);font-size:14px">${d}</span>`:''}</div>`;

      cg: () => CG3D.length ? `<div class="grid zoom">${CG3D.map(x=>`<div>${IMG('gallery',x.img,x.t)}<p style="margin:4px 0 0;font-size:13px">${x.u?A(x.t,x.u):x.t}${x.d?'<br><span style="color:var(--sub)">'+x.d+'</span>':''}</p></div>`).join('')}</div>` : `<div class="box" style="color:var(--sub)">（3DCG未設定：CG3D に作品を追加）</div>`,
      video: () => { const card = v => v.yt ? `<div class="vid"><iframe src="https://www.youtube.com/embed/${v.yt}" title="${v.t}" loading="lazy" allowfullscreen></iframe></div>` : v.x ? `<div class="vidx"><blockquote class="twitter-tweet"><a href="${v.x}"></a></blockquote></div>` : `<div class="vid ph0">${v.t}<br><small>（準備中）</small></div>`;
        return [['original','動画（オリジナル曲）','生きていれば音楽を作ることもある'],['cover','動画（カバー）','自作音源のUTAU（注寝ととと）のカバー動画です'],['cg3d','動画（3DCG）',''],['misc','動画（雑多）','']].map(([k,t,d])=>`<h2>${t}</h2>${d?`<p class="lead">${d}</p>`:''}<div class="vgrid">${VIDEOS[k].map(card).join('')}</div>`).join(''); },
      music: () => `<p class="lead">自作音源のUTAUカバーが多め　音楽が聴ける</p><iframe class="sc" title="SoundCloud" loading="lazy" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(MUSIC_URL)}&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false"></iframe><p style="font-size:12px">${A('SoundCloudで開く',MUSIC_URL)}</p>`,
      work: () => `<p class="lead">ご依頼で描かせていただいたものです。</p><p>■コミッション（リンク先に作例）<br>skeb：${A('https://skeb.jp/@sazyou_dnrk','https://skeb.jp/@sazyou_dnrk')}<br>skeb：${A('https://skeb.jp/@kazyou_dnrk','https://skeb.jp/@kazyou_dnrk')}</p>${WORK.length?WORK.map(x=>`<div class="wk"><time>${x.d||''}</time><h3>■${x.u?A(x.t,x.u):x.t}</h3>${x.yt?`<div class="wkv"><iframe src="https://www.youtube.com/embed/${x.yt}" title="${x.t}" loading="lazy" allowfullscreen></iframe></div>`:x.img?`<div class="zoom">${IMG('gallery',x.img,x.t)}</div>`:''}</div>`).join(''):`<div class="box" style="color:var(--sub)">（準備中：WORK に作品を追加）</div>`}`,
      comic: () => COMIC.map(linkCard).join(''),

let SUB = '', LAST = '';
function route(to) {
  const [id, sub] = (to || location.hash.slice(1) || 'home').split('/');
  SUB = sub || '';
  LAST = (to || location.hash.slice(1) || 'home');
  const key = VIEWS[id] ? id : 'home';
  $('#main').innerHTML = VIEWS[key]();
  $('#nav').innerHTML = PAGES.map(([k,t])=>`<a href="#${k}" class="${k===key?'on':''}">${t}</a>`).join('');
  $('#nav').classList.remove('open'); $('#menu').setAttribute('aria-expanded','false');
  document.title = (key==='home'?'':(PAGES.find(p=>p[0]===key)||[0,'受賞歴'])[1]+' | ')+'砂上拠点電力発電所';
  if (document.querySelector('.twitter-tweet')) { if (window.twttr && twttr.widgets) twttr.widgets.load($('#main')); else if (!document.getElementById('twjs')) { const sc = document.createElement('script'); sc.id = 'twjs'; sc.async = true; sc.src = 'https://platform.twitter.com/widgets.js'; document.head.appendChild(sc); } }
  if (key === 'home') counter();
  if (!route.keep) scrollTo(0,0);
}
addEventListener('hashchange', () => { if (location.hash.slice(1) !== LAST) route(); });
route();
fetch('characters.json').then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => { CH = d; route.keep = true; route(LAST); route.keep = false; })
  .catch(() => { CHERR = true; route.keep = true; route(LAST); route.keep = false; });

document.addEventListener('click', e => {
  const lk = e.target.closest('a[href^="#"]');
  if (lk) { e.preventDefault(); const h = lk.getAttribute('href').slice(1) || 'home'; const same = h.split('/')[0] === (location.hash.slice(1) || 'home').split('/')[0]; try { location.hash = h; } catch (_) {} route.keep = same; route(h); route.keep = false; return; }
  const m = e.target.closest('#menu');
  if (m) { m.setAttribute('aria-expanded', $('#nav').classList.toggle('open')); return; }
  const sl = e.target.closest('[data-slide]');
  if (sl) { const el = $('#slides'), w = el.clientWidth, max = el.scrollWidth - w; let x = el.scrollLeft + (+sl.dataset.slide) * w; if (x > max + 1) x = 0; if (x < 0) x = max; el.scrollTo({left:x, behavior:'smooth'}); return; }
  const im = e.target.closest('.zoom img');
  if (im) { $('#lb img').src = im.src; $('#lb').classList.add('open'); return; }
  if (e.target.closest('#lb')) $('#lb').classList.remove('open');
});
/* アクセスカウンター（counterapi.dev）。同じブラウザでは最初に付いた番号をずっと表示する */
const COUNTER_URL = 'https://api.counterapi.dev/v1/sazyoudnrk-home-page/visits';
async function counter() {
  const el = $('#counter'); if (!el) return;
  let n = 0; try { n = +localStorage.getItem('visitorNo') || 0; } catch (e) {}
  if (!n) { try { const r = await fetch(COUNTER_URL + '/up'); n = +(await r.json()).count || 0; if (n) { try { localStorage.setItem('visitorNo', n); } catch (e) {} } } catch (e) {} }
  if (!n || !$('#counter')) return;
  el.className = 'counter'; el.hidden = false;
  el.innerHTML = `あなたは<br><b>${String(n).padStart(6,'0')}</b><br>人目のお客様です`;
}
/* ホームのスライドを自動送り（触っている間と、触ってから6秒は止める） */
let slideTouch = 0;
['pointerdown','touchstart','wheel','mouseover'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('.hero')) slideTouch = Date.now(); }, {passive:true}));
setInterval(() => {
  const el = $('#slides'); if (!el || document.hidden || Date.now() - slideTouch < 6000) return;
  const w = el.clientWidth, max = el.scrollWidth - w; if (max <= 0) return;
  let x = el.scrollLeft + w; if (x > max + 1) x = 0;
  el.scrollTo({left:x, behavior:'smooth'});
}, 4500);
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('#mailbtn')) { e.preventDefault(); e.stopPropagation(); location.href = 'mailto:' + CONTACT.mail[2].replace('●','@'); } }, true);
addEventListener('keydown', e => { if (e.key === 'Escape') $('#lb').classList.remove('open'); });
