const $ = s => document.querySelector(s);
const ext = u => /^https?:/.test(u);
const A = (t,u,c='') => `<a class="${c}" href="${u}"${ext(u)?' target="_blank" rel="noopener"':''}>${t}</a>`;
// 画像: images/<dir>/<name>.(jpg|png|webp) を順に試し、無ければファイル名入りの枠を出す
const thumbSrc = (d,n) => `images/${d}/t/${n}.webp?v=${IMGV}`;
const IMG = (dir,name,alt='',hide=false) => `<img src="${dir==='top'?`images/top/${name}.${EXTS[0]}?v=${IMGV}`:thumbSrc(dir,name)}" alt="${alt}" loading="lazy" data-d="${dir}" data-n="${name}" data-i="${dir==='top'?0:-1}"${hide?' data-hide="1"':''}>`;
const galImg = p => { const i = p.lastIndexOf('/'); return IMG(p.slice(0,i), p.slice(i+1), '', true).replace(' loading="lazy"',''); };
document.addEventListener('error', e => {
  const im = e.target; if (im.tagName !== 'IMG' || !im.dataset.n) return;
  const i = +im.dataset.i + 1;
  if (i < EXTS.length) { im.dataset.i = i; im.src = `images/${im.dataset.d}/${im.dataset.n}.${EXTS[i]}?v=${IMGV}`; return; }
  if (im.dataset.hide) { im.remove(); return; }
  im.outerHTML = `<div class="ph" title="images/${im.dataset.d}/${im.dataset.n}"></div>`;
}, true);
document.addEventListener('load', e => { const g = e.target.closest && e.target.closest('.gal'); if (g) g.hidden = false; }, true);
const nums = (p,n) => Array.from({length:n},(_,i)=>p+String(i+1).padStart(2,'0'));
const head = (t,l) => `<h1>${t}</h1><p class="lead">${l||''}</p>`;

const OEKAKI_FB = {apiKey:'AIzaSyBKDKSCbAxEWi65Xfx8bNb5c_rkGY_s6sg', authDomain:'sazyouden-oekaki.firebaseapp.com', projectId:'sazyouden-oekaki', storageBucket:'sazyouden-oekaki.firebasestorage.app', messagingSenderId:'120770222207', appId:'1:120770222207:web:db5f7025443008a398874a'};   // 例 {apiKey:'…', authDomain:'…', projectId:'…', appId:'…'}

async function okInit() {
  if (!OEKAKI_FB || OK.fs) return;
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [app, fs, au] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-firestore.js'), import(base+'firebase-auth.js')]);
  const a = app.initializeApp(OEKAKI_FB); OK.fs = fs; OK.db = fs.getFirestore(a);
  const auth = au.getAuth(a);   // 匿名ログイン（自分の投稿を1分以内に取り消すため）

const okLocal = () => { try { return JSON.parse(localStorage.getItem('okLocal')||'[]'); } catch(e) { return []; } };
async function okList() {
  if (!OEKAKI_FB) return okLocal().map(x => ({...x, mine:true}));
  await okInit(); const fs = OK.fs;
  const s = await fs.getDocs(fs.query(fs.collection(OK.db,OEKAKI_COL), fs.orderBy('createdAt','desc'), fs.limit(40)));
  return s.docs.map(d => { const x = d.data(); return {id:d.id, ...x, t:(x.createdAt&&x.createdAt.toMillis)?x.createdAt.toMillis():Date.now(), mine:!!OK.uid && x.uid===OK.uid}; });
}
async function okPost(p) {
  if (!OEKAKI_FB) {
    const a = okLocal(); a.unshift({...p, id:String(Date.now()), t:Date.now()});
    try { localStorage.setItem('okLocal', JSON.stringify(a.slice(0,8))); } catch(e) { throw new Error('この端末に保存できませんでした（容量）'); }

  await okInit(); const fs = OK.fs;
  if (!OK.uid) throw new Error('匿名ログインに失敗しました');
  await fs.addDoc(fs.collection(OK.db,OEKAKI_COL), {...p, uid:OK.uid, createdAt:fs.serverTimestamp()});
}
async function okDelete(id) {
  if (!OEKAKI_FB) { localStorage.setItem('okLocal', JSON.stringify(okLocal().filter(x => x.id !== id))); return; }

}
function okTick() {   // 取り消しボタンの残り秒数を更新（1分たつと消える）
  const bs = document.querySelectorAll('[data-del]'); if (!bs.length) { clearInterval(OK.timer); OK.timer = 0; return; }

}

function okSnap() { OK.hist.push(OK.L.map(c => c.getImageData(0,0,OK_W,OK_H))); if (OK.hist.length > 25) OK.hist.shift(); }
function okClear() { OK.L[0].fillStyle = '#fff'; OK.L[0].fillRect(0,0,OK_W,OK_H); OK.L[1].clearRect(0,0,OK_W,OK_H); }
function okMerge() {   // 見えているレイヤーを白地の上に重ねて1枚にする
  const m = document.createElement('canvas'); m.width = OK_W; m.height = OK_H; const c = m.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0,0,OK_W,OK_H);
  OK.L.forEach((l,i) => { if (OK.vis[i]) c.drawImage(l.canvas,0,0); });
  return m;
}
function okPick(pt) {
  const d = okMerge().getContext('2d').getImageData(Math.max(0,Math.min(OK_W-1,Math.round(pt[0]))), Math.max(0,Math.min(OK_H-1,Math.round(pt[1]))), 1, 1).data;
  OK.color = '#' + [d[0],d[1],d[2]].map(v => v.toString(16).padStart(2,'0')).join(''); $('#okcolor').value = OK.color; OK.tool = 'pen'; okTool();

  c.strokeStyle = er ? '#fff' : OK.color; c.lineWidth = OK.size*(er?3:1);
  c.lineCap = c.lineJoin = 'round'; c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke(); c.globalCompositeOperation = 'source-over';
}
function okBlank() { const d = okMerge().getContext('2d').getImageData(0,0,OK_W,OK_H).data; for (let i = 0; i < d.length; i += 4) if (d[i] < 250 || d[i+1] < 250 || d[i+2] < 250) return false; return true; }
function okExport() {
  for (const [type,q] of [['image/webp',.8],['image/webp',.6],['image/jpeg',.7],['image/jpeg',.5]]) {
    const u = okMerge().toDataURL(type,q); if (u.startsWith('data:'+type) && u.length < OK_MAXKB*1370) return u;
  }

}
function okInitPage() {
  const cv = $('#okcv'); if (!cv) return;
  OK.cv = cv; OK.ctx = cv.getContext('2d'); OK.L = [$('#okcv0').getContext('2d'), OK.ctx]; OK.cur = 1; OK.vis = [true,true]; OK.hist = []; okClear(); okTool();
  const down = e => { e.preventDefault(); if (OK.tool === 'pick') { okPick(okPos(e)); return; } okSnap(); OK.drawing = true; OK.last = okPos(e); okLine(OK.last, [OK.last[0]+.01, OK.last[1]]); try { cv.setPointerCapture(e.pointerId); } catch(_) {} };
  const move = e => { if (!OK.drawing) return; e.preventDefault(); const p = okPos(e); okLine(OK.last, p); OK.last = p; };

let SUB = '', SUB2 = '', LAST = '';
function route(to) {
  const [id, sub, sub2] = (to || location.hash.slice(1) || 'home').split('/');
  SUB = sub || ''; SUB2 = sub2 || '';
  LAST = (to || location.hash.slice(1) || 'home');
  const key = VIEWS[id] ? id : 'home';
  $('#main').innerHTML = VIEWS[key]();
  $('#nav').innerHTML = PAGES.map(([k,t])=>`<a href="#${k}" class="${k===key?'on':''}">${t}</a>`).join('');
  $('#nav').classList.remove('open'); $('#menu').setAttribute('aria-expanded','false');
  document.title = (key==='home'?'':(PAGES.find(p=>p[0]===key)||[0,key==='terms'?'利用規約':key==='world'?'世界観説明':'受賞歴'])[1]+' | ')+'砂上拠点電力発電所';
  if (document.querySelector('.twitter-tweet, .twitter-timeline')) { if (window.twttr && twttr.widgets) twttr.widgets.load($('#main')); else if (!document.getElementById('twjs')) { const sc = document.createElement('script'); sc.id = 'twjs'; sc.async = true; sc.src = 'https://platform.twitter.com/widgets.js'; document.head.appendChild(sc); } }
  if (key === 'home') counter();
  if (key === 'oekaki') okInitPage();
  if (!route.keep) scrollTo(0,0);
  const ont = document.querySelector('.gtabs a.on, .tabs a.on'); if (ont) { const g = ont.parentElement; g.scrollLeft = ont.offsetLeft - (g.clientWidth - ont.offsetWidth) / 2; }
  prefetchNext(key);
}
/* 次に見そうな画像を、画面が落ち着いたあとに軽いサムネイルだけ1枚ずつ先読みする（通信量節約モードのときはしない） */
const PF = {done: new Set(), q: [], run: false};
function prefetchNext(key) {
  if (navigator.connection && navigator.connection.saveData) return;
  const th = p => { const i = p.lastIndexOf('/'); return thumbSrc(p.slice(0,i), p.slice(i+1)); };
  const urls = [];
  if (CH && key === 'character') {
    const one = CH.characters.find(c => c.id === SUB);
    if (one) {                                               // 詳細：前後のキャラの立ち絵とギャラリー
      const sib = CH.characters.filter(c => c.group === one.group && hasProfile(c)), i = sib.indexOf(one);
      for (const o of [sib[(i+1)%sib.length], sib[(i-1+sib.length)%sib.length]]) { if (o.portrait) urls.push(th(o.portrait)); (o.gallery||[]).slice(0,4).forEach(g => urls.push(th(g))); }
    } else CH.characters.filter(hasProfile).forEach(c => { if (c.portrait) urls.push(th(c.portrait)); });   // 一覧：各詳細の立ち絵
  } else if (key === 'home') {
    [...ART_NEW, ...nums('art', ART)].slice(0, 8).forEach(n => urls.push(thumbSrc('gallery', n)));
  }
  PF.q.push(...urls.filter(u => !PF.done.has(u)));
  if (PF.run) return; PF.run = true;
  const step = () => { const u = PF.q.shift(); if (!u) { PF.run = false; return; } PF.done.add(u); const im = new Image(); im.onload = im.onerror = () => setTimeout(step, 60); im.src = u; };
  (window.requestIdleCallback || (f => setTimeout(f, 1200)))(step, {timeout: 3000});
}

document.addEventListener('click', e => {

  const m = e.target.closest('#menu');
  if (m) { m.setAttribute('aria-expanded', $('#nav').classList.toggle('open')); return; }
  const sl = e.target.closest('[data-slide]');
  if (sl) { const el = $('#slides'), w = el.clientWidth, max = el.scrollWidth - w; let x = el.scrollLeft + (+sl.dataset.slide) * w; if (x > max + 1) x = 0; if (x < 0) x = max; el.scrollTo({left:x, behavior:'smooth'}); return; }
  const pb = e.target.closest('[data-pop]');
  if (pb) {
    $('#mmt').textContent = pb.dataset.pop;
    $('#mmlist').innerHTML = POP[pb.dataset.pop].map(([t,u,d])=>A(esc(t)+(d?`<small>${esc(d)}</small>`:''),u,'mrow')).join('');
    $('#mm').classList.add('open'); return;
  }
  if (e.target.closest('#mmx') || e.target.id === 'mm' || e.target.closest('#mmlist a')) $('#mm').classList.remove('open');
  const nv = e.target.closest('#lb .nv');
  if (nv) { lbGo(nv.classList.contains('n') ? 1 : -1); return; }
  const im = e.target.closest('.zoom img');
  if (im) {
    const scope = im.closest('.zoom').parentElement;
    LB.list = [...scope.querySelectorAll('.zoom img')].filter(x => x.src);
    LB.i = Math.max(0, LB.list.indexOf(im)); lbShow(); $('#lb').classList.add('open'); return;
  }
  if (e.target.closest('#lb')) $('#lb').classList.remove('open');
});
/* キャラ詳細：左右スワイプで同じグループの前後のキャラへ */
{ let sx = null, sy = 0, t0 = 0;
  addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; t0 = e.target.closest('#lb,iframe,.twitter-timeline,#slides') ? 1 : 0; }, {passive:true});
  addEventListener('touchend', e => {
    if (sx === null || t0) { sx = null; return; }
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    const cn = document.querySelector('.cnav');
    if (!cn || $('#lb').classList.contains('open')) return;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) location.hash = dx < 0 ? cn.dataset.next : cn.dataset.prev;
  }, {passive:true});
}
/* 拡大表示：＜＞ボタン・左右スワイプ・矢印キーで同じ並びの画像を行き来 */
const LB = {list: [], i: 0};
let FULL = null;   // images/full.json：画像名 → 元ファイルの拡張子
fetch('images/full.json', {cache:'no-cache'}).then(r => r.json()).then(j => FULL = j).catch(() => {});
const lbFull = (d, n, cb) => { const e = FULL[d + '/' + n]; if (!e) return; const u = `images/${d}/${n}.${e}?v=${IMGV}`, im = new Image(); im.onload = () => cb(u); im.src = u; };
function lbShow() {
  const n = LB.list.length;
  const el = LB.list[LB.i], lbi = $('#lb img'), fd = el.dataset.d, fn = el.dataset.n;
  lbi.src = el.currentSrc || el.src;                       // まず軽い画像を即表示
  if (fd && FULL) { lbFull(fd, fn, u => { if (LB.list[LB.i] === el) lbi.src = u; }); }
  for (const k of [1, -1]) { const o = LB.list[(LB.i + k + LB.list.length) % LB.list.length]; if (o && o.dataset.d && FULL) lbFull(o.dataset.d, o.dataset.n, () => {}); }  // 前後の分も先読み
  $('#lb').classList.toggle('one', n < 2);
  $('#lb .ct').textContent = (LB.i + 1) + ' / ' + n;
}
function lbGo(d) { const n = LB.list.length; if (n < 2) return; LB.i = (LB.i + d + n) % n; lbShow(); }
{ let sx = null, sy = 0;
  const lb = $('#lb');
  lb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  lb.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) { lbGo(dx < 0 ? 1 : -1); lb.dataset.sw = '1'; setTimeout(() => delete lb.dataset.sw, 400); }
  }, {passive:true});
  lb.addEventListener('click', e => { if (lb.dataset.sw) e.stopImmediatePropagation(); }, true);
}
/* アクセスカウンター（abacus.jasoncameron.dev・認証なし）。ページを開くたびに加算 */
var counterN = 0, counterBusy = false;   // 読み込みごとに1回だけ加算（ホームに戻っても増やさない）
async function counter() {
  const el = $('#counter'); if (!el) return;
  const COUNTER_URLS = ['https://abacus.jsn.cam/hit/sazyoudnrk.github.io-home-page/visits','https://abacus.jasoncameron.dev/hit/sazyoudnrk.github.io-home-page/visits','https://api.counterapi.dev/v1/sazyoudnrk-home-page/visits/up'];   // 上から順に試す
  if (!counterN && !counterBusy) { counterBusy = true; for (const u of COUNTER_URLS) { try { const c = new AbortController(); setTimeout(() => c.abort(), 6000); const r = await fetch(u, {signal:c.signal}); const j = await r.json(); counterN = +(j.value ?? j.count) || 0; if (counterN) break; } catch (e) {} } counterBusy = false; }
  if (!counterN || !$('#counter')) return;
  el.className = 'counter'; el.hidden = false;
  el.innerHTML = `あなたは<b>${String(counterN).padStart(6,'0')}</b>人目のお客様です`;
}
/* ホームのスライドを自動送り（触っている間と、触ってから6秒は止める） */
let slideTouch = 0;
['pointerdown','touchstart','wheel','mouseover'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('.hero')) slideTouch = Date.now(); }, {passive:true}));
setInterval(() => {
  const el = $('#slides'); if (!el || document.hidden || Date.now() - slideTouch < 6000) return;
  const w = el.clientWidth, max = el.scrollWidth - w; if (max <= 0) return;
  let x = el.scrollLeft + w; if (x > max + 1) x = 0;
  el.scrollTo({left:x, behavior:'smooth'});
}, 4500);
document.addEventListener('click', async e => { const b = e.target.closest && e.target.closest('#sharebtn'); if (!b) return; e.preventDefault();
  const url = location.origin + location.pathname, title = '砂上拠点電力発電所';
  if (navigator.share) { try { await navigator.share({title, url}); } catch (er) {} return; }
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(title) + '&url=' + encodeURIComponent(url), '_blank', 'noopener');
});
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('#mailbtn')) { e.preventDefault(); e.stopPropagation(); location.href = 'mailto:' + CONTACT.mail[2].replace('●','@'); } }, true);
addEventListener('keydown', e => { const o = $('#lb').classList.contains('open'); const cn = document.querySelector('.cnav'); if (!o && cn && e.key === 'ArrowRight') location.hash = cn.dataset.next; else if (!o && cn && e.key === 'ArrowLeft') location.hash = cn.dataset.prev; else if (e.key === 'Escape') { $('#lb').classList.remove('open'); $('#mm').classList.remove('open'); } else if (o && e.key === 'ArrowRight') lbGo(1); else if (o && e.key === 'ArrowLeft') lbGo(-1); });
